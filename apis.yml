aid: mesa
name: Mesa
description: >-
  Mesa is a Boulder, Colorado fintech that provides embedded electronic-invoicing, payments, and
  invoice-financing (early-payment) infrastructure for B2B supplier networks. Suppliers get paid early
  via ACH while Mesa automates repayment once the buyer settles. Mesa ships as drop-in embedded UI —
  a JavaScript SDK (MesaClient) that renders Mesa's onboarding, dashboard, and instant-payout flows in
  an origin-pinned iframe inside a partner's web app — backed by a Partner REST API for user
  authentication and invoice retrieval. Auth is via API keys (clientId/clientSecret) exchanged for a
  short-lived JWT, with optional OIDC (Okta, Azure AD, Google). Backed by Matrix Partners; SOC 2.
